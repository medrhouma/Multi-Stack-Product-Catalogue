services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    ports:
      - "5433:5432"   # 5433 côté Windows (pour le seed), 5432 dans le réseau Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/shop?schema=public   # hôte = nom du service "db", port interne 5432
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "4000:4000"

  ngapp:
    build: ./ngapp
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on: [api]

  nextapp:
    build:
      context: ./nextapp
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api   # appelée depuis le navigateur
    restart: unless-stopped
    environment:
      API_URL: http://api:4000/api                       # appelée depuis le serveur Next (réseau Docker)
    ports:
      - "3000:3000"
    depends_on: [api]

volumes:
  pgdata: